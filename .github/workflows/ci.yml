name: CI — Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"

      # conftest.py stubs out torch, transformers, tiktoken, fitz (PyMuPDF),
      # bs4, dotenv, openai, instructor, spacy/scispaCy, and GLiNER —
      # so CI never downloads heavy NLP models or multi-GB model weights.
      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install \
            pyyaml requests biopython beautifulsoup4 pymupdf tiktoken \
            pydantic "instructor==0.4.8" \
            python-dotenv rich fastapi uvicorn httpx openai \
            python-multipart websockets pytest pytest-cov

      - name: Run tests
        env:
          OPENAI_API_KEY: "ci-stub-key"
          PUBMED_API_KEY: "ci-stub-key"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest tests/ -v --tb=short \
            --cov=src --cov=api \
            --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=38

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
